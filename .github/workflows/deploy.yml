name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  TF_VERSION: 1.9.5

permissions:
  contents: read

jobs:
  ensure-ecr:
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ steps.ecr_url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Ensure ECR repository exists
        working-directory: infra
        run: terraform apply -auto-approve -input=false -target=aws_ecr_repository.app -var "image_tag=bootstrap"

      - name: Expose ECR URL
        id: ecr_url
        working-directory: infra
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

  build-push:
    needs: ensure-ecr
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          ECR_URL: ${{ needs.ensure-ecr.outputs.ecr_url }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build -t "$ECR_URL:$IMAGE_TAG" ./app
          docker push "$ECR_URL:$IMAGE_TAG"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: terraform apply
        working-directory: infra
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: terraform apply -auto-approve -input=false -var "image_tag=$IMAGE_TAG"
